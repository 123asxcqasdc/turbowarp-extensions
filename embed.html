<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐌 Расширения TurboWarp</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐌%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }

        body {
            background-color: #1b3b1b;
            background-image: radial-gradient(circle at 30% 40%, #2b5a2b 0%, #0e2f0e 90%);
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        iframe {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        #splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background: radial-gradient(circle at 30% 40%, #2b5a2b 0%, #0e2f0e 90%);
            color: #e2f0c0;
            z-index: 10;
            transition: opacity 0.4s ease;
        }

        #splash.hide {
            opacity: 0;
            pointer-events: none;
        }

        .snail {
            font-size: 4.5rem;
            filter: drop-shadow(2px 4px 4px #0f2a0f);
            animation: bounce 1s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(8deg); }
            50% { transform: translateY(-14px) rotate(8deg); }
        }

        #splash p {
            font-size: 1.1rem;
            color: #cde5b0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div id="splash">
    <div class="snail">🐌</div>
    <p>загружаем расширения...</p>
</div>

<iframe
    id="frame"
    src="https://123asxcqasdc.github.io/turbowarp-extensions/"
    title="Расширения TurboWarp"
    allow="clipboard-write"
></iframe>

<script>
    const frame = document.getElementById("frame");

    function breakoutAllLinks() {
        try {
            const doc = frame.contentDocument;
            if (!doc || doc.__breakoutInstalled) return;
            doc.__breakoutInstalled = true;
            // любая ссылка внутри фрейма открывается в новой вкладке, а не внутри iframe
            doc.addEventListener("click", (ev) => {
                const a = ev.target.closest("a[href]");
                if (!a) return;
                const href = a.getAttribute("href");
                if (!href || href.startsWith("javascript:") || href.startsWith("#")) return;
                ev.preventDefault();
                ev.stopPropagation();
                window.open(a.href, "_blank", "noopener");
            }, true);
            // страховка: если фрейм всё же навигировался — вернуть каталог
            doc.addEventListener("submit", (ev) => ev.preventDefault(), true);
        } catch (e) {
            // cross-origin — перехват невозможен
        }
    }

    frame.addEventListener("load", () => {
        breakoutAllLinks();
        const splash = document.getElementById("splash");
        if (splash) {
            splash.classList.add("hide");
            setTimeout(() => splash.remove(), 500);
        }
    });
</script>

</body>
</html>
