name: Обновление каталога

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: catalog-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Собрать каталог отдельно от базы репозитория
        run: |
          mkdir -p output
          python3 update.py
        env:
          TW_RAW: output/turbowarp_extensions.json
          TW_IDS: output/extension_ids.json
          TW_OUTPUT: output/extensions.json
          TW_CACHE: output/cache
          TW_FETCH_ERRORS: output/fetch-errors.json
      - name: Сравнить с базой
        run: |
          python3 report_changes.py turbowarp_extensions.json output/turbowarp_extensions.json output/fetch-errors.json > output/changes.md
          cat output/changes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Сохранить результат и отчёт
        uses: actions/upload-artifact@v4
        with:
          name: catalog-update
          path: |
            output/turbowarp_extensions.json
            output/extension_ids.json
            output/extensions.json
            output/changes.md
            output/fetch-errors.json
          retention-days: 30

  publish:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: catalog-update
          path: output
      - name: Проверить и опубликовать изменения
        shell: bash
        run: |
          set -euo pipefail
          changed=$(python3 validate_catalog.py . output)
          if [ "$changed" != true ]; then
            echo 'Содержимое каталога не изменилось.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp output/turbowarp_extensions.json output/extension_ids.json output/extensions.json .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turbowarp_extensions.json extension_ids.json extensions.json
          git commit -m 'Обновить каталог расширений'
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo 'Каталог обновлён в ветке по умолчанию.' >> "$GITHUB_STEP_SUMMARY"
